		## PgAdmin Database ##
		
spring.datasource.url=jdbc:postgresql://localhost:5432/simplestcrud
spring.datasource.username=postgres
spring.datasource.password=1608
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto= update
spring.h2.console.enabled=true
hibernate.dialect=org.hibernate.dialect.H2Dialect
# default path: h2-console
#spring.h2.console.path=/h2-ui

	##Actuator 
# To expose specific endpoints (e.g., health and info)
#management.endpoints.web.exposure.include=health,info
# OR: To expose ALL endpoints (use with caution in production!)
management.endpoints.web.exposure.include=*
# To show full health details (including DB status, disk space, etc.)
management.endpoint.health.show-details=always

spring.main.allow-bean-definition-overriding=true


		## Kafka ##
# Address of your Kafka server (started in Terminal 2)
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group configuration
spring.kafka.consumer.group-id=my-test-group
spring.kafka.consumer.auto-offset-reset=earliest

# Serialization (Spring Boot handles this by default for Strings, but good to be explicit)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer



