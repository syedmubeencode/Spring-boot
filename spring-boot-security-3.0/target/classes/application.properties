server.port=8123

# --- Database Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/simplestcrud
spring.datasource.username=postgres
spring.datasource.password=1608
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Config ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Important: PostgreSQL is case-sensitive with quoted identifiers. 
# This strategy ensures your table/column names match your entity names exactly.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

